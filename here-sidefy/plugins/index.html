  <link rel="stylesheet" href="/assets/site.css?v=182">
</head>
<body class="catalog-page">
  <div class="site-shell site-shell--wide">
    <nav class="crumbbar" data-i18n-aria-label="nav.breadcrumb" aria-label="Breadcrumb">
      <div class="crumbbar__inner">
        <ol class="crumbs">
        <li><a href="/">Locusable <em>Studio</em></a></li>
        <li><a href="/here-sidefy/">Here Sidefy</a></li>
        <li><span aria-current="page" data-i18n="crumb.plugins">Plugins</span></li>
        </ol>
        <div class="theme-control" data-theme-control>

            <span class="sr-only">Settings</span>
          </button>
          <div class="theme-control__menu" id="theme-menu" role="menu" data-theme-menu hidden>
            <div class="theme-control__group" role="group" aria-label="Theme">
            <button class="theme-control__option" type="button" role="menuitemradio" data-theme-option="system" aria-label="System" title="System"><span class="theme-control__option-icon theme-control__option-icon--system" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg></span></button>
            <button class="theme-control__option" type="button" role="menuitemradio" data-theme-option="dark" aria-label="Dark" title="Dark"><span class="theme-control__option-icon theme-control__option-icon--dark" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg></span></button>
            <button class="theme-control__option" type="button" role="menuitemradio" data-theme-option="light" aria-label="Light" title="Light"><span class="theme-control__option-icon theme-control__option-icon--light" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></span></button>
            </div>
            <span class="theme-control__divider" aria-hidden="true"></span>
            <div class="theme-control__group" role="group" aria-label="Language">
            <button class="theme-control__option theme-control__option--lang" type="button" role="menuitemradio" data-lang-option="en" aria-label="English" title="English">EN</button>
            <button class="theme-control__option theme-control__option--lang" type="button" role="menuitemradio" data-lang-option="zh" aria-label="中文" title="中文">中</button>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <header class="catalog-hero">
      <h1 class="catalog-title" data-i18n="plugins.title">Featured Plugins</h1>
      <p class="catalog-lead" data-i18n="plugins.lead">Community plugins from the official Sidefy showcase — RSS, deals, gaming, and more. Open a card for the GitHub source.</p>
    </header>

    <section class="catalog-section catalog-section--plugins" data-reveal data-i18n-aria-label="plugins.listLabel" aria-label="Featured plugins">
      <div class="plugin-grid" id="plugin-grid"></div>
    </section>

    <footer class="footer">
      <div class="footer__inner">
        <span data-i18n="footer.copyright">Copyright © 2026 Locusable Studio. All rights reserved.</span>
        <span class="footer__links">
          <a href="/here-sidefy/privacy/" data-i18n="footer.privacy">Privacy Policy</a>
          <a href="https://sidefy.locusable.com/featured-plugins" target="_blank" rel="noopener noreferrer" data-i18n="footer.showcase">Official showcase</a>
        </span>
      </div>
    </footer>
  </div>

  <script>
    const pluginIconPaths = {
      sparkles: '<path d="M16 18a2 2 0 0 1 2 2a2 2 0 0 1 2-2a2 2 0 0 1-2-2a2 2 0 0 1-2 2m0-12a2 2 0 0 1 2 2a2 2 0 0 1 2-2a2 2 0 0 1-2-2a2 2 0 0 1-2 2M9 18a6 6 0 0 1 6-6a6 6 0 0 1-6-6a6 6 0 0 1-6 6a6 6 0 0 1 6 6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>',
      rss: '<path d="M4 19a1 1 0 1 0 2 0a1 1 0 1 0-2 0M4 4a16 16 0 0 1 16 16M4 11a9 9 0 0 1 9 9" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>',
      "brand-apple": '<path d="M8.286 7.008C5.07 7.008 4 10.238 4 12.928C4 16.157 6.143 21 8.286 21c1.165-.05 1.799-.538 3.214-.538c1.406 0 1.607.538 3.214.538S19 17.771 19 15.619c-.03-.011-2.649-.434-2.679-3.23c-.02-2.335 2.589-3.179 2.679-3.228c-1.096-1.606-3.162-2.113-3.75-2.153c-1.535-.12-3.032 1.077-3.75 1.077c-.729 0-2.036-1.077-3.214-1.077M12 4a2 2 0 0 0 2-2a2 2 0 0 0-2 2" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>',
      "brand-steam": '<g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M16.5 5a4.5 4.5 0 1 1-.653 8.953L11.5 16.962V17a3 3 0 0 1-2.824 3H8.5a3 3 0 0 1-2.94-2.402L3 16.5V13l3.51 1.755a2.99 2.99 0 0 1 2.834-.635l2.727-3.818A4.5 4.5 0 0 1 16.5 5"/><path d="M15.5 9.5a1 1 0 1 0 2 0a1 1 0 1 0-2 0" fill="currentColor"/></g>',
      "device-nintendo": '<g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M10 20V4H7a4 4 0 0 0-4 4v8a4 4 0 0 0 4 4zm4 0V4h3a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4z"/><path d="M16.5 15.5a1 1 0 1 0 2 0a1 1 0 1 0-2 0m-11-7a1 1 0 1 0 2 0a1 1 0 1 0-2 0" fill="currentColor"/></g>',
      pokeball: '<g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0"/><path d="M9 12a3 3 0 1 0 6 0a3 3 0 1 0-6 0m-6 0h6m6 0h6"/></g>',
      "currency-bitcoin": '<path d="M6 6h8a3 3 0 0 1 0 6a3 3 0 0 1 0 6H6M8 6v12m0-6h6M9 3v3m4-3v3M9 18v3m4-3v3" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>',
      messages: '<path d="m21 14l-3-3h-7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1zm-7 1v2a1 1 0 0 1-1 1H6l-3 3V11a1 1 0 0 1 1-1h2" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>',
    };

    function createPluginIcon(name, color) {
      const icon = document.createElement("span");
      icon.className = "plugin-card__icon";
      icon.style.color = color;
      icon.setAttribute("aria-hidden", "true");
      icon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${pluginIconPaths[name]}</svg>`;
      return icon;
    }

    const pluginTagZh = {
      AI: "AI",
      Daily: "每日",
      RSS: "RSS",
      News: "资讯",
      Shopping: "购物",
      Deals: "优惠",
      Gaming: "游戏",
      Entertainment: "娱乐",
      Crypto: "加密货币",
      Alerts: "提醒",
      Community: "社区",
      Social: "社交",
    };

    const featuredPlugins = [
      {
        name: "Say Hi",
        description: "A random English Wikipedia article each day — AI generates the event title and greeting in your app language. Requires an LLM API key in Sidefy Advanced Settings.",
        descriptionZh: "每天呈现一篇随机英文维基百科条目 — AI 会用你的应用语言生成事件标题与问候语。需要在 Sidefy 高级设置中配置 LLM API 密钥。",
        tags: ["AI", "Daily"],
        href: "https://github.com/sidefy-team/sidefy-plugins/tree/main/sayhi",
        icon: "sparkles",
        iconColor: "#3366cc",
      },
      {
        name: "FreshRSS",
        description: "Fetch unread and recent articles from your self-hosted FreshRSS instance via Google Reader API. Stay updated with your personal news feeds.",
        descriptionZh: "通过 Google Reader API，从你自托管的 FreshRSS 拉取未读与最新文章，随时跟进个人订阅。",
        tags: ["RSS", "News"],
        href: "https://github.com/sidefy-team/sidefy-plugins/tree/main/freshrss",
        icon: "rss",
        iconColor: "#d97706",
      },
      {
        name: "App Store Discount",
        description: "Monitor price drops and discounts for apps on your Mac App Store wishlist. Get notified when your favorite apps go on sale.",
        descriptionZh: "监控 Mac App Store 心愿单中应用的降价与折扣，喜欢的应用打折时立即提醒你。",
        tags: ["Shopping", "Deals"],
        href: "https://github.com/sidefy-team/sidefy-plugins/tree/main/appstore_discount",
        icon: "brand-apple",
        iconColor: "#78716c",
      },
      {
        name: "Steam Wishlist Discount",
        description: "Get instant alerts when games on your Steam wishlist go on sale. Never miss a great deal on your favorite games.",
        descriptionZh: "Steam 心愿单中的游戏打折时立即提醒，绝不错过心动优惠。",
        tags: ["Gaming", "Deals"],
        href: "https://github.com/sidefy-team/sidefy-plugins/tree/main/steam_wishlist_discount",
        icon: "brand-steam",
        iconColor: "#57534e",
      },
      {
        name: "Switch Discount Tracker",
        description: "Track Nintendo Switch eShop sales across multiple regions. Add game NSUIDs and region codes to get timeline alerts with sale price and discount when a watched title goes on sale.",
        descriptionZh: "跟踪多个地区的 Nintendo Switch eShop 折扣信息。添加游戏 NSUID 与地区代码后，关注的游戏一旦打折，就会在时间线上显示售价与折扣力度。",
        tags: ["Gaming", "Deals"],
        href: "https://github.com/sidefy-team/sidefy-plugins/tree/main/switch_wishlist_discount",
        icon: "device-nintendo",
        iconColor: "#dc2626",
      },
      {
        name: "Pokemon Daily",
        description: "Discover a new Pokemon every day with detailed information, stats, and beautiful artwork. Perfect for Pokemon fans and trainers.",
        descriptionZh: "每天认识一只新的宝可梦，附带详细资料、能力数据与精美插画，宝可梦爱好者和训练家的每日必看。",
        tags: ["Entertainment", "Daily"],
        href: "https://github.com/sidefy-team/sidefy-plugins/tree/main/pokemon_daily",
        icon: "pokeball",
        iconColor: "#ca8a04",
      },
      {
        name: "Crypto Price Monitor",
        description: "Monitor cryptocurrency prices via CoinGecko with price threshold and 24h percentage change alerts. Track multiple tokens with a configurable cooldown.",
        descriptionZh: "通过 CoinGecko 监控加密货币价格，支持设置价格阈值与 24 小时涨跌幅提醒。可同时跟踪多个代币，提醒冷却时间也能自由配置。",
        tags: ["Crypto", "Alerts"],
        href: "https://github.com/sidefy-team/sidefy-plugins/tree/main/crypto_price_watcher",
        icon: "currency-bitcoin",
        iconColor: "#ca8a04",
      },
      {
        name: "V2EX Notifications",
        description: "Unread V2EX notifications on your timeline — replies, thanks, tips, mentions, and favorites, each with distinct colors. Uses your private RSS token.",
        descriptionZh: "把未读的 V2EX 通知放上时间线 — 回复、感谢、打赏、提及和收藏各有专属颜色区分。使用你的私有 RSS 令牌接入。",
        tags: ["Community", "Social"],
        href: "https://github.com/sidefy-team/sidefy-plugins/tree/main/v2ex_notifications",
        icon: "messages",
        iconColor: "#78716c",
      },
    ];

    const grid = document.getElementById("plugin-grid");
    const ctaChev = '<span class="chev" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>';

    function currentLang() {
      if (window.LocusableI18n) return window.LocusableI18n.getLang();
      try {
        return window.localStorage.getItem("locusable-lang") === "zh" ? "zh" : "en";
      } catch (error) {
        return "en";
      }
    }

    function renderPlugins() {
      const zh = currentLang() === "zh";
      const learnMore = (window.LocusableI18n && window.LocusableI18n.t("cta.learnMore")) || (zh ? "了解更多" : "Learn more");
      grid.replaceChildren();
      featuredPlugins.forEach((plugin, index) => {
        const card = document.createElement("a");
        card.className = "plugin-card";
        card.href = plugin.href;
        card.target = "_blank";
        card.rel = "noopener noreferrer";
        card.style.animationDelay = `${0.04 + index * 0.05}s`;

        const head = document.createElement("div");
        head.className = "plugin-card__head";
        const title = document.createElement("h3");
        title.textContent = plugin.name;
        head.append(createPluginIcon(plugin.icon, plugin.iconColor), title);

        const desc = document.createElement("p");
        desc.className = "plugin-card__desc";
        desc.textContent = zh ? plugin.descriptionZh : plugin.description;

        const foot = document.createElement("div");
        foot.className = "plugin-card__foot";
        const tags = document.createElement("div");
        tags.className = "plugin-tags";
        for (const tag of plugin.tags) {
          const span = document.createElement("span");
          span.textContent = zh ? (pluginTagZh[tag] || tag) : tag;
          tags.appendChild(span);
        }
        const cta = document.createElement("span");
        cta.className = "plugin-card__cta";
        cta.innerHTML = learnMore + ctaChev;
        foot.append(tags, cta);
        card.append(head, desc, foot);
        grid.appendChild(card);
      });
    }

    renderPlugins();
    document.addEventListener("langchange", renderPlugins);
  </script>
  <script src="/assets/i18n.js?v=6" defer></script>
  <script src="/assets/site.js?v=59" defer></script>
</body>
</html>
